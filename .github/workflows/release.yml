---
name: Release
on:
  workflow_run:
    workflows:
      - CI/CD
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-release-${{ github.repository }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  plan:
    if: >-
      github.repository == 'dceoy/pdmt5'
      && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out validated source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan release from pyproject.toml
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || "${GITHUB_SHA}" != "${SOURCE_SHA}" ]]; then
            echo '::notice::Workflow SHA differs from the validated source; skipping.'
            exit 0
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${main_sha}" != "${SOURCE_SHA}" ]]; then
            echo '::notice::main advanced since validation; skipping stale release.'
            exit 0
          fi
          version="$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::project.version must be MAJOR.MINOR.PATCH.'
            exit 1
          fi
          tag="v${version}"
          if git rev-parse --verify -q "refs/tags/${tag}^{commit}" > /dev/null; then
            tagged_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if gh release view "${tag}" --json isDraft --jq '.isDraft' > /tmp/release-draft 2>/dev/null; then
              if [[ "$(cat /tmp/release-draft)" == false ]]; then
                echo "::notice::${tag} is already published; skipping."
                exit 0
              fi
            fi
            if [[ "${tagged_sha}" != "${SOURCE_SHA}" ]]; then
              echo "::error::${tag} already points to another commit."
              exit 1
            fi
          fi
          latest="$(gh release list --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [[ -n "${latest}" ]]; then
            if [[ ! "${latest}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Latest release tag is not stable SemVer: ${latest}"
              exit 1
            fi
            if ! python3 - "${version}" "${latest#v}" <<'PY'
          import sys
          current, previous = (tuple(map(int, s.split("."))) for s in sys.argv[1:])
          sys.exit(0 if current > previous else 1)
          PY
            then
              echo "::error::project.version must exceed the latest release (${latest})."
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
  build:
    needs: plan
    if: needs.plan.outputs.release-tag != ''
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/python-package-release-on-pypi-and-github.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      package-path: .
      create-github-release: false
      publish-to-pypi: false
  draft-release:
    needs:
      - plan
      - build
    if: needs.plan.outputs.release-tag != ''
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-release.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      tag-name: ${{ needs.plan.outputs.release-tag }}
      create-new-tag: true
      draft: true
  attach-assets:
    needs:
      - build
      - draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.build.outputs.distribution-artifact-name }}
          path: dist/
      - name: Check distribution version
        env:
          RELEASE_TAG: ${{ needs.draft-release.outputs.release-tag }}
        run: |
          version="${RELEASE_TAG#v}"
          test -f "dist/pdmt5-${version}.tar.gz"
          shopt -s nullglob
          wheels=(dist/pdmt5-"${version}"-*.whl)
          if ((${#wheels[@]} == 0)); then
            echo "::error::No wheel found for ${RELEASE_TAG}."
            exit 1
          fi
      - name: Sign wheels with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.whl
      - name: Attach distributions and signatures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft-release.outputs.release-tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
  publish-to-pypi:
    needs:
      - build
      - attach-assets
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pdmt5
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.build.outputs.distribution-artifact-name }}
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          verbose: true
          skip-existing: true
  publish-release:
    needs:
      - draft-release
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft-release.outputs.release-tag }}
        run: |
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
