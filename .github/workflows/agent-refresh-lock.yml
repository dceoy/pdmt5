name: Refresh branch lockfile

on:
  push:
    branches:
      - agent/support-python-314

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Regenerate uv.lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "${BRANCH}"
          python -m pip install --quiet uv
          uv lock
          rm -f .github/workflows/agent-refresh-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/agent-refresh-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh lockfile for Python 3.14"
          git push origin "HEAD:${BRANCH}"
